<div class="flex flex-col min-h-screen">
  <main class="flex-grow">
    <router-outlet />
  </main>

  <footer class="w-full py-5 text-center text-[10px] tracking-wider text-slate-400 dark:text-slate-500 font-mono border-t border-slate-200/60 dark:border-slate-800 bg-white dark:bg-slate-950/20 select-none">
    build ({{ gitCommit }})
  </footer>

  @if (showScrollTop()) {
    <button 
      (click)="scrollToTop()"
      class="fixed bottom-8 right-6 z-50 flex items-center justify-center w-12 h-12 text-slate-700 dark:text-slate-200 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border border-slate-200/80 dark:border-slate-800/80 rounded-full shadow-lg hover:shadow-xl hover:bg-slate-50 dark:hover:bg-slate-800 hover:-translate-y-1 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 cursor-pointer scroll-btn-fade-in"
      aria-label="Scroll to top"
    >
      <i class="pi pi-chevron-up text-base font-bold"></i>
    </button>
  }
</div>
